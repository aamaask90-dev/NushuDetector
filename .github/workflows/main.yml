name: Build Android APK Force Model

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Create required directories
      run: |
        mkdir -p app/src/main/assets
        mkdir -p app/src/main/java/com/example/engine

    - name: Force Download / Inject Model and Engine files
      run: |
        echo "Injecting Model and Engine..."
        
        # يمكنك استبدال الرابط أدناه برابط التحميل المباشر لملف best.onnx الخاص بك
        # أو سنقوم برفعه كـ Release Asset على جيت هب وسحبه هنا مباشرة
        # wget -O app/src/main/assets/best.onnx "رابط_التحميل_المباشر_للنموذج"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build APK with Gradle
      run: ./gradlew assembleDebug

    - name: Upload Final APK with Model
      uses: actions/upload-artifact@v4
      with:
        name: app-with-model-debug
        path: app/build/outputs/apk/debug/app-debug.apk
