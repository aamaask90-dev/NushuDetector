name: Build Android APK Force Model

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Ensure Assets Directory Exists
      run: mkdir -p app/src/main/assets

    - name: Force Download Model (best.onnx)
      run: |
        echo "Downloading and forcing model into assets..."
        # ضع رابط التحميل المباشر لملف best.onnx الخاص بك هنا إذا كان مرفوعاً على درايف أو سيرفر، أو سيتم جلبه تلقائياً
        # wget -O app/src/main/assets/best.onnx "رابط_التحميل_المباشر"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build APK with Gradle
      run: ./gradlew assembleDebug

    - name: Upload Final APK with Model
      uses: actions/upload-artifact@v4
      with:
        name: app-final-debug
        path: app/build/outputs/apk/debug/app-debug.apk
